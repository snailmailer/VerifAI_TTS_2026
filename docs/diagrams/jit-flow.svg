<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="VerifAI - JIT redaction and activity flow">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>VerifAI - JIT redaction and activity flow</text>
  <rect x="120" y="60" width="560" height="60" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>1. User types or pastes in an approved AI chat</text><text x="400" y="100" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>content script checks text on submit/paste</text>
<line x1="400" y1="120" x2="400" y2="150" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="120" y="150" width="560" height="60" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>2. Sensitive text replaced in the editor</text><text x="400" y="190" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>[REDACTED: ...] placeholders; send is cancelled until clean</text>
<line x1="400" y1="210" x2="400" y2="240" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="120" y="240" width="560" height="60" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>3. Metadata event -&gt; background worker</text><text x="400" y="280" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>categories, count, hostname, browser; no values</text>
<line x1="400" y1="300" x2="400" y2="330" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="120" y="330" width="560" height="60" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>4. Worker -&gt; native host -&gt; collector</text><text x="400" y="370" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>credential cached per worker; retry in 30 s on failure</text>
<line x1="400" y1="390" x2="400" y2="420" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="120" y="420" width="560" height="60" rx="10" fill="#fecaca" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>5. Collector persists, then pushes SSE</text><text x="400" y="460" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>dashboard fetches at once; JIT PII banner shows</text>
<line x1="400" y1="480" x2="400" y2="510" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="120" y="510" width="560" height="60" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="532" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>6. Daily logs rewritten</text><text x="400" y="550" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>&lt;yyyy&gt;\&lt;MMM-yyyy&gt;\*_dd-MMM-yyyy.json/.pdf</text>
<text x="400" y="620" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Typical end-to-end latency on the same computer: well under one second. Same path on Windows, macOS and Linux and in Chrome, Edge, Brave and Firefox.</text>
</svg>
