<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-label="VerifAI - standalone installation flow">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>VerifAI - standalone installation flow</text>
  <rect x="100" y="60" width="600" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>1. Run the setup</text><text x="400" y="100" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Windows: Install-VerifAI.cmd / Setup.cmd   macOS-Linux: sh setup.sh</text>
<line x1="400" y1="116" x2="400" y2="138" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="138" width="600" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>2. Checks</text><text x="400" y="178" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>OS, 64-bit, package integrity (SHA256), port 43821, runtime</text>
<line x1="400" y1="194" x2="400" y2="216" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="216" width="600" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>3. Stage the extension</text><text x="400" y="256" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>stable per-user folder (survives removing the USB)</text>
<line x1="400" y1="272" x2="400" y2="294" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="294" width="600" height="56" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>4. Guided browser steps (pop-up per browser)</text><text x="400" y="334" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Developer mode -&gt; Load unpacked -&gt; paste path -&gt; enable</text>
<line x1="400" y1="350" x2="400" y2="372" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="372" width="600" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>5. Detect the extension IDs</text><text x="400" y="412" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>waits up to 30 s for the browser to save them</text>
<line x1="400" y1="428" x2="400" y2="450" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="450" width="600" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>6. Install collector + native bridge + startup</text><text x="400" y="490" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>registers IDs; daily log folder configured</text>
<line x1="400" y1="506" x2="400" y2="528" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="528" width="600" height="56" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="550" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>7. Health check and finish pop-up</text><text x="400" y="568" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>dashboard from the toolbar icon; test with synthetic PII</text>
</svg>
