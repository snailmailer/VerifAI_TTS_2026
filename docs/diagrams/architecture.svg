  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>VerifAI - system architecture</text>
  <rect x="40" y="60" width="130" height="70" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="105" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Chrome</text><text x="105" y="100" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>approved AI sites:</text><text x="105" y="115" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Copilot, Gemini, Perplexity</text>
<line x1="105" y1="130" x2="105" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
