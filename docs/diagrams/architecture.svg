<rect x="490" y="60" width="130" height="70" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="555" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Firefox</text><text x="555" y="100" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>approved AI sites:</text><text x="555" y="115" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Copilot, Gemini, Perplexity</text>
<line x1="555" y1="130" x2="555" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="170" width="580" height="90" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/><text x="330" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>VerifAI browser extension (Manifest V3)</text><text x="330" y="210" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>content scripts: PII redaction in the chat editor, site visit events</text><text x="330" y="225" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>background worker: domain blocking (declarativeNetRequest), event queue, browser name</text><text x="330" y="240" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>no prompt text leaves the browser - categories, counts and hostnames only</text>
<line x1="330" y1="260" x2="330" y2="300" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><text x="340" y="284" text-anchor="start" font-size="10.5" fill="#1f2937" font-family='Segoe UI, Helvetica, Arial, sans-serif'>native messaging (per-browser allowlist of extension IDs)</text>
<rect x="180" y="300" width="300" height="70" rx="10" fill="#fef9c3" stroke="#1f2937" stroke-width="1.5"/><text x="330" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Native host  com.verifai.bridge</text><text x="330" y="340" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>validates the calling extension ID</text><text x="330" y="355" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>returns the local credential + dashboard ticket</text>
<line x1="330" y1="370" x2="330" y2="410" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><text x="340" y="394" text-anchor="start" font-size="10.5" fill="#1f2937" font-family='Segoe UI, Helvetica, Arial, sans-serif'>HTTPS-free loopback: http://127.0.0.1:43821</text>
<rect x="130" y="410" width="400" height="90" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="330" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Local collector (Node.js, per user)</text><text x="330" y="450" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>authenticated event ingest, validation (no free-text fields)</text><text x="330" y="465" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>server-sent events -&gt; dashboard refreshes instantly (JIT)</text><text x="330" y="480" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>writes daily JSON + PDF logs after every persisted event</text>
<line x1="230" y1="500" x2="160" y2="540" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="430" y1="500" x2="500" y2="540" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="540" width="250" height="95" rx="10" fill="#e9d5ff" stroke="#1f2937" stroke-width="1.5"/><text x="165" y="562" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Activity store + daily logs</text><text x="165" y="580" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>approval-events.json</text><text x="165" y="595" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>EVENT LOGS\&lt;yyyy&gt;\&lt;MMM-yyyy&gt;\</text><text x="165" y="610" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>AI_Activity_Logs_dd-MMM-yyyy.json/.pdf</text><text x="165" y="625" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Redacted_PII_Logs_dd-MMM-yyyy.json/.pdf</text>
<rect x="380" y="540" width="250" height="95" rx="10" fill="#fecaca" stroke="#1f2937" stroke-width="1.5"/><text x="505" y="562" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>SOC dashboard (local web UI)</text><text x="505" y="580" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>AI Activities tab | Redacted PII tab</text><text x="505" y="595" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>sort/filter, CSV/JSON/PDF export</text><text x="505" y="610" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>opened signed-in from the toolbar icon</text>
<rect x="660" y="170" width="220" height="120" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="770" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Blocked AI sites</text><text x="770" y="210" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>claude.ai, chatgpt.com, deepseek,</text><text x="770" y="225" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>huggingface, poe, ... (catalogued)</text><text x="770" y="240" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>top-level navigations redirect</text><text x="770" y="255" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>to the VerifAI block page</text>
<line x1="620" y1="215" x2="660" y2="215" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<rect x="660" y="410" width="220" height="90" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="770" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Runtime</text><text x="770" y="450" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Windows: bundled node.exe (USB)</text><text x="770" y="465" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>macOS: LaunchAgent</text><text x="770" y="480" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Linux: systemd --user service</text>
<rect x="660" y="520" width="220" height="115" rx="10" fill="#cffafe" stroke="#1f2937" stroke-width="1.5"/><text x="770" y="542" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Private windows</text><text x="770" y="560" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Chromium: user toggle only</text><text x="770" y="575" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>(no policy can force it);</text><text x="770" y="590" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Enterprise default disables</text><text x="770" y="605" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Incognito/InPrivate by policy.</text><text x="770" y="620" text-anchor="middle" font-size="11" fill="#374151" font-family='Segoe UI, Helvetica, Arial, sans-serif'>Firefox: private_browsing policy.</text>
